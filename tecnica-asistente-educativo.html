<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asistente Educativo - Instituto Fleming</title>

    <!-- Tailwind CDN (debe cargarse desde el inicio, NO vía fetch) -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>

    <!-- Fuentes e iconos -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/@n8n/chat@1.40.1/dist/style.css" rel="stylesheet" />

    <!-- Tema compartido (colores, tipografía) -->
    <script src="assets/js/tailwind-config.js"></script>

    <!-- Tu CSS custom -->
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>

  <body
    data-nivel="tecnicas"
    data-programa-id="tecnica-asistente-educativo"
    class="bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark font-body antialiased transition-colors duration-300"
  >
    <header data-include="partials/nav.html"></header>

    <main>
      <section data-include="partials/programa-detalle.html"></section>
    </main>

    <footer data-include="partials/footer.html"></footer>

    <div id="n8n-chat"></div>

    <!-- main.js es module porque importa render-sections -->
    <script type="module" src="assets/js/main.js"></script>
    <script type="module" src="assets/js/n8n-chat.js"></script>
  </body>
</html>
