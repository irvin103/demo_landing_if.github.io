<section id="oferta-educativa" class="pt-8 pb-16 md:pb-24 bg-white dark:bg-surface-dark scroll-mt-24">
  <div class="container mx-auto px-4 lg:px-8">
    <div class="text-center mb-12">
      <div class="flex items-center justify-center gap-4">
        <div class="h-1 w-12 bg-primary rounded-full"></div>
        <h2 class="text-3xl md:text-4xl font-bold text-gray-900 dark:text-white">Oferta Educativa</h2>
        <div class="h-1 w-12 bg-primary rounded-full"></div>
      </div>
    </div>

    <div id="oferta-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8"></div>
  </div>
</section>

<div
  id="oferta-modal"
  class="fixed inset-0 z-[100] hidden items-center justify-center p-4"
  role="dialog"
  aria-modal="true"
  aria-labelledby="oferta-modal-title"
  aria-hidden="true"
>
  <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" data-modal-close></div>

  <div class="relative bg-white dark:bg-surface-dark rounded-2xl shadow-xl w-full max-w-3xl max-h-[85vh] overflow-y-auto">
    <div class="sticky top-0 z-10 flex items-center justify-between gap-4 p-6 border-b border-gray-100 dark:border-gray-700 bg-white dark:bg-surface-dark">
      <h3 id="oferta-modal-title" class="text-2xl font-bold text-gray-900 dark:text-white">Oferta Educativa</h3>
      <button
        type="button"
        data-modal-close
        class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-500 dark:text-gray-300 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-primary"
        aria-label="Cerrar"
      >
        <span class="material-icons">close</span>
      </button>
    </div>
    <div id="oferta-modal-body" class="p-6"></div>
  </div>
</div>
