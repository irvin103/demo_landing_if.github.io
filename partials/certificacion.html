<section id="certificacion" class="relative py-16 md:py-20 bg-white dark:bg-surface-dark overflow-hidden">
  <div class="cert-glow absolute inset-0 pointer-events-none" aria-hidden="true"></div>

  <div class="relative container mx-auto px-4 lg:px-8">
    <div class="max-w-2xl mx-auto text-center" data-reveal>
      <span class="text-primary font-bold uppercase tracking-wider text-sm">Certificación de competencias</span>
      <h2 class="mt-3 text-3xl md:text-4xl font-bold text-gray-900 dark:text-white">
        Centro de Evaluación y Entidad certificadora
      </h2>
      <p class="mt-3 text-secondary-text-light dark:text-secondary-text-dark">
        Formamos parte de la red CONOCER de prestadores de servicios.
      </p>
    </div>

    <div class="mt-12 max-w-4xl mx-auto grid md:grid-cols-[1fr_auto_1fr] items-center gap-8 md:gap-12">
      <figure class="cert-card" data-reveal style="--reveal-delay: 120ms">
        <img
          src="assets/img/logo-red-conocer.webp"
          alt="red CONOCER de prestadores de servicios, Centro de Evaluación"
          width="408"
          height="245"
          loading="lazy"
          class="cert-logo h-28 md:h-32 w-auto mx-auto"
        />
        <figcaption class="mt-5 text-sm font-semibold uppercase tracking-wider text-gray-500">Evaluación de competencias</figcaption>
      </figure>

      <div class="cert-divider hidden md:block" data-reveal style="--reveal-delay: 240ms" aria-hidden="true"></div>

      <figure class="cert-card" data-reveal style="--reveal-delay: 360ms">
        <img
          src="assets/img/logo-imifle.webp"
          alt="Universidad Fleming IMIFLE"
          width="480"
          height="459"
          loading="lazy"
          class="cert-logo h-32 md:h-36 w-auto mx-auto"
        />
        <figcaption class="mt-5 text-sm font-semibold uppercase tracking-wider text-gray-500">Entidad certificadora</figcaption>
      </figure>
    </div>
  </div>
</section>
